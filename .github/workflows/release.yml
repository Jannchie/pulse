name: Release

# 推送 v* 标签（如 v0.1.0）时构建并发布。标签必须与 pulse/Cargo.toml 的版本一致。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check version matches tag
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'pulse').version
          if ("v$version" -ne '${{ github.ref_name }}') {
            Write-Error "Tag ${{ github.ref_name }} does not match pulse version $version"
            exit 1
          }

      - name: Build
        run: cargo build --release

      # 用来打包安装程序；runner 上没有时用 choco 安装。
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error 'ISCC.exe not found'; exit 1 }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $name = 'pulse-${{ github.ref_name }}-windows-x64'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/pulse.exe "dist/$name.exe"
          Compress-Archive -Path target/release/pulse.exe, LICENSE -DestinationPath "dist/$name.zip"
          # 安装程序；图标是 pulse/build.rs 生成在 OUT_DIR 里的 pulse.ico。
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $ico = Get-ChildItem target/release/build -Recurse -Filter pulse.ico | Sort-Object LastWriteTime | Select-Object -Last 1
          & $env:ISCC /Q "/DAppVersion=$version" "/DFileVersion=$($version.Split('-')[0])" `
            "/DSourceExe=$((Resolve-Path target/release/pulse.exe).Path)" "/DIconFile=$($ico.FullName)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" "/DOutputName=$name-setup" installer/pulse.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit 1 }
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName `
            --title 'Pulse ${{ github.ref_name }}' --generate-notes
