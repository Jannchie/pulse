[package]
name = "pulse"
version = "0.3.1"
edition = "2024"

[features]
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
memmap2 = "0.9"
nucleo-matcher = "0.3.1"
pulse-probe = { path = "../pulse-probe" }
raw-window-handle = "0.6"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
